<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¿dónde estás? - Party Game</title>
    <!-- Tailwind CSS (Play CDN for quick setup in static folder) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neon: {
                            pink: '#ff00ff',
                            cyan: '#00ffff',
                            yellow: '#ffff00',
                            purple: '#8a2be2'
                        },
                        dark: '#0a0a0a'
                    },
                    fontFamily: {
                        sans: ['"Comic Sans MS"', '"Chalkboard SE"', '"Marker Felt"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white min-h-screen overflow-x-hidden select-none">
